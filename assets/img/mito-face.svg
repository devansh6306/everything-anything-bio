<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 50 200 200" role="img" aria-labelledby="mito-face-title">
  <title id="mito-face-title">Mito the Mighty</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c17bf5"/>
      <stop offset="1" stop-color="#8b46d6"/>
    </linearGradient>
    <linearGradient id="matrix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a2fb8"/>
      <stop offset="1" stop-color="#4e1f96"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset="1" stop-color="#5fc9ee"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#f5b800"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd43b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyClip"><rect x="110" y="58" width="180" height="300" rx="90"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="418" rx="120" ry="12" fill="#000" opacity="0.25"/>

  <!-- legs -->
  <rect x="160" y="340" width="24" height="56" rx="12" fill="#7b3fc4"/>
  <rect x="216" y="340" width="24" height="56" rx="12" fill="#7b3fc4"/>

  <!-- sneakers -->
  <g>
    <path d="M128 412c0-20 16-30 36-30h14c10 0 14 8 14 16v14z" fill="url(#shoe)"/>
    <rect x="124" y="406" width="72" height="10" rx="5" fill="#fff"/>
    <path d="M154 388l10 8M166 386l8 9" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M272 412c0-20-16-30-36-30h-14c-10 0-14 8-14 16v14z" fill="url(#shoe)"/>
    <rect x="204" y="406" width="72" height="10" rx="5" fill="#fff"/>
    <path d="M246 388l-10 8M234 386l-8 9" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- right arm flexing (viewer's right) -->
  <path d="M282 214 L330 232 L336 182" stroke="#9a55e0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <ellipse cx="318" cy="214" rx="20" ry="15" fill="#a964ea" transform="rotate(-30 318 214)"/>
  <circle cx="337" cy="170" r="20" fill="#fff"/>
  <path d="M325 166h20M325 175h20" stroke="#d9d4f5" stroke-width="3" stroke-linecap="round"/>

  <!-- left arm raised, thumbs up (viewer's left) -->
  <path d="M118 220c-30-6-46-30-40-66" stroke="#b06ef0" stroke-width="26" stroke-linecap="round" fill="none"/>
  <g>
    <rect x="56" y="124" width="46" height="40" rx="16" fill="#fff"/>
    <rect x="58" y="100" width="18" height="36" rx="9" fill="#fff"/>
    <path d="M78 136h20M78 146h20M78 156h18" stroke="#d9d4f5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- body (outer membrane) -->
  <rect x="110" y="58" width="180" height="300" rx="90" fill="url(#body)"/>
  <g clip-path="url(#bodyClip)">
    <!-- soft shade on right, highlight on left -->
    <ellipse cx="300" cy="230" rx="60" ry="200" fill="#6f2fbf" opacity="0.35"/>
    <ellipse cx="140" cy="140" rx="18" ry="50" fill="#fff" opacity="0.18"/>
  </g>

  <!-- inner membrane window with glowing cristae -->
  <rect x="138" y="222" width="124" height="118" rx="58" fill="url(#matrix)"/>
  <g filter="url(#glow)" fill="none" stroke="#ffd43b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 252c14 0 14 18 28 18s14-18 28-18 14 18 28 18 14-18 18-18"/>
    <path d="M150 282c14 0 14 18 28 18s14-18 28-18 14 18 28 18 14-18 18-18"/>
    <path d="M160 312c12 0 12 14 24 14s12-14 24-14 12 14 24 14"/>
  </g>
  <g fill="#fff6c2">
    <circle cx="170" cy="240" r="3"/><circle cx="240" cy="296" r="3"/><circle cx="200" cy="330" r="2.5"/>
  </g>

  <!-- face -->
  <ellipse cx="166" cy="164" rx="22" ry="25" fill="#fff"/>
  <ellipse cx="234" cy="164" rx="22" ry="25" fill="#fff"/>
  <circle cx="170" cy="168" r="13" fill="#22113d"/>
  <circle cx="230" cy="168" r="13" fill="#22113d"/>
  <circle cx="175" cy="162" r="5" fill="#fff"/>
  <circle cx="235" cy="162" r="5" fill="#fff"/>
  <ellipse cx="146" cy="198" rx="14" ry="8" fill="#ff6fb5" opacity="0.55"/>
  <ellipse cx="254" cy="198" rx="14" ry="8" fill="#ff6fb5" opacity="0.55"/>
  <path d="M168 190c4 34 60 34 64 0z" fill="#22113d"/>
  <path d="M182 210c10-9 26-9 36 0-8 9-28 9-36 0z" fill="#ff7a9c"/>
  <rect x="178" y="190" width="44" height="7" rx="3" fill="#fff"/>

  <!-- goggles -->
  <rect x="106" y="98" width="188" height="20" rx="10" fill="#33376b"/>
  <rect x="134" y="84" width="58" height="44" rx="18" fill="#4a4f8c"/>
  <rect x="208" y="84" width="58" height="44" rx="18" fill="#4a4f8c"/>
  <rect x="140" y="90" width="46" height="32" rx="13" fill="url(#lens)"/>
  <rect x="214" y="90" width="46" height="32" rx="13" fill="url(#lens)"/>
  <rect x="190" y="100" width="20" height="10" rx="5" fill="#4a4f8c"/>
  <path d="M148 112l14-16M222 112l14-16" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

</svg>
